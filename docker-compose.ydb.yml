# Standalone configuration for the YDB deployment rehearsal.
# Existing PostgreSQL containers and volumes are managed separately.
services:
  app:
    build:
      context: .
      target: runner
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-}
        NEXT_PUBLIC_TELEGRAM_BOT_USERNAME: ${NEXT_PUBLIC_TELEGRAM_BOT_USERNAME:-}
        NEXT_PUBLIC_ALLOWED_EMAIL_DOMAINS: ${NEXT_PUBLIC_ALLOWED_EMAIL_DOMAINS:-}
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
        NEXT_PUBLIC_SMARTCAPTCHA_SITE_KEY: ${NEXT_PUBLIC_SMARTCAPTCHA_SITE_KEY:-}
        NEXT_PUBLIC_YANDEX_METRICA_ID: ${NEXT_PUBLIC_YANDEX_METRICA_ID:-}
    env_file: .env
    environment:
      DB_PROVIDER: ydb
      YDB_SERVICE_ACCOUNT_KEY_FILE: /run/secrets/ydb-service-account.json
    secrets: [ydb_service_account]
    ports: ["127.0.0.1:3000:3000"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 30s
  migrate:
    build:
      context: .
      target: migrator
    env_file: .env
    environment:
      DB_PROVIDER: ydb
      YDB_SERVICE_ACCOUNT_KEY_FILE: /run/secrets/ydb-service-account.json
    secrets: [ydb_service_account]
    profiles: [tools]

secrets:
  ydb_service_account:
    file: ./.secrets/authorized_key.json

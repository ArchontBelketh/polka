services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: polka
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: polka_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # localhost-only: reachable from the host (psql, Prisma in dev), never
      # from the internet. Prod override removes the port entirely.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U polka -d polka_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      target: runner
      args:
        # NEXT_PUBLIC_* must be baked in at build time. compose reads these from
        # the .env file next to this compose file (prod) — empty in dev is fine.
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-}
        NEXT_PUBLIC_TELEGRAM_BOT_USERNAME: ${NEXT_PUBLIC_TELEGRAM_BOT_USERNAME:-}
        NEXT_PUBLIC_ALLOWED_EMAIL_DOMAINS: ${NEXT_PUBLIC_ALLOWED_EMAIL_DOMAINS:-}
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
        NEXT_PUBLIC_SMARTCAPTCHA_SITE_KEY: ${NEXT_PUBLIC_SMARTCAPTCHA_SITE_KEY:-}
    ports:
      - "3000:3000"
    env_file: .env.local
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # node is always present in the runtime image; wget/curl may not be
      test:
        - "CMD"
        - "node"
        - "-e"
        - "require('http').get('http://localhost:3000/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  # One-off schema tasks (prisma db push). Built from the lightweight `migrator`
  # stage (prisma CLI + schema only) — a fraction of the `builder` image, so the
  # deploy doesn't run out of disk building a second full image. Never starts on
  # `up` (profile "tools"); invoked via `docker compose run --rm migrate`.
  migrate:
    build:
      context: .
      target: migrator
    env_file: .env.local
    profiles: ["tools"]
    depends_on:
      db:
        condition: service_healthy
    command: ["npx", "prisma", "db", "push"]

volumes:
  pgdata:

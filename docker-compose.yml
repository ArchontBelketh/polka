services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: polka
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: polka_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # localhost-only: reachable from the host (psql, Prisma in dev), never
      # from the internet. Prod override removes the port entirely.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U polka -d polka_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "3000:3000"
    env_file: .env.local
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # node is always present in the runtime image; wget/curl may not be
      test:
        - "CMD"
        - "node"
        - "-e"
        - "require('http').get('http://localhost:3000/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  pgdata:
